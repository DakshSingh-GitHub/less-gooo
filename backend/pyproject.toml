[project]
name = "lessgooo-backend"
version = "0.1.0"
description = "FastAPI backend for LessGooo travel companion (Appwrite Cloud + Vercel)"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.9.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
